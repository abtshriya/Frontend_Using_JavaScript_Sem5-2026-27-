<!--Experiment 1 - Familiarization of HTML and CSS Basics-->
<!DOCTYPE html>
<html lang="en">
    <head>
       <meta charset="UTF-8"> <!--Character Encoding-->
       <title>Lab 1 - HTML & CSS Basics</title>
       <style>
        body {
            font-family: Georgia, 'Times New Roman', serif;
            background: linear-gradient(135deg, #a4c4ff, #cfdef3);
            margin: 0;
            padding: 20px;
            color: #222;
        }
        h1{
            color: #ffffff;
            background-color: #2c3e50;
            padding: 12px 20px;
            border-radius: 6px;
        }
        h2{
            color:#2c3e50;
            border-bottom:2px solid #2c3e50;
            padding-bottom: 4px;
        }
        p{
            line-height: 1.6;
        }
        .highlight{
            background-color: #fff3cd;
            padding: 2px 6px;
            border-radius: 3px;
        }
        ul li{
            margin-bottom: 6px;
        }
        table{
            border-collapse: collapse;
            width: 60%;
            margin-top: 10px;
        }
        table, th, td{
            border: 1px solid #999;
        }
        th,td{
            padding: 8px 12px;
            text-align: left;
        }
        a{
            color: #2980b9;
            text-decoration: none;
            font-weight: bold;
        }
        .box{
            border: 2px dashed #2980b9;
            padding: 15px;
            width: 300px;
            margin-top:15px;
        }
       </style>
    </head>
    <body>       
    </body>
</html>
